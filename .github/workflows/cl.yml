name: My first Ci
on:
  push:
    branches:
        - main

jobs:
  build:
    runs-on: ubuntu-latest
    premissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@4
    
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x ./mvnw

      - name: Build Application
        uses: ./mvnw clean package

      - name: Build Docker Image
        run: docker build -t ghcr.io/majiangbo1119/ci-cd: latest .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
        

